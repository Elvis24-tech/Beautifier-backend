services:
  - type: web
    name: beautyshop-api
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn beautyshop.wsgi:application"
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432